version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    labels:
      - dependencies
    ignore:
      # the types follow the oldest Node the sources run on, so a newer API fails the type check
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
